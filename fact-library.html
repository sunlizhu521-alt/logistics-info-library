<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>物流事实表库 - 物流信息库</title>
    <link rel="stylesheet" href="assets/styles.css?v=0.1.0">
    <script defer src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script defer src="assets/app.js?v=0.1.0"></script>
  </head>
  <body data-page="fact-library">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">物</span><div><strong>物流信息库</strong><small>Logistics Finance</small></div></div>
      <nav class="nav">
        <a href="index.html">工作台</a>
        <a href="logistics.html">物流大表</a>
        <a class="active" href="fact-library.html">物流事实表库</a>
      </nav>
    </aside>

    <main class="content">
      <header class="page-header">
        <div>
          <p class="eyebrow">Fact Library</p>
          <h1>物流事实表库</h1>
        </div>
        <label class="file-picker">
          <input type="file" accept=".xlsx,.xls,.csv" data-upload-source>
          上传物流原表
        </label>
      </header>

      <section class="metric-grid">
        <article class="metric"><span>文件状态</span><strong data-source-status>未上传</strong></article>
        <article class="metric"><span>业务表数量</span><strong data-sheet-count>0</strong></article>
        <article class="metric"><span>总记录数</span><strong data-total-records>0</strong></article>
        <article class="metric"><span>保存时间</span><strong data-saved-time>-</strong></article>
      </section>

      <section class="panel">
        <div class="section-title">
          <h2>事实表文件</h2>
          <span>当前工具读取医疗-发货、医疗-退货、医疗-单独发货、医疗-专线。</span>
        </div>
        <div class="file-list" data-sheet-list></div>
      </section>

      <section class="panel">
        <div class="section-title">
          <h2>数据预览</h2>
          <span>展示第一个业务表的前 20 行。</span>
        </div>
        <div class="table-wrap"><table data-preview-table></table></div>
      </section>
    </main>
  </body>
</html>
